[package]
name = "agentcenter"
version = "0.2.0"
description = "统一管理多个 AI coding agent 的全局配置"
edition = "2021"
rust-version = "1.77"

[lib]
# Tauri 2 要求有一个 lib 目标，移动端和桌面端共用同一套 IPC 逻辑
name = "agentcenter_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri 运行时与窗口
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"

# 配置序列化：TOML 写配置，JSON 读写 lock 文件与 manifest
serde = { version = "1", features = ["derive"] }
# preserve_order 必须开：改写用户的配置时要保持原有键顺序，
# 否则每次同步都会产生大量无关的 diff
serde_json = { version = "1", features = ["preserve_order"] }
toml = "0.8"

# 保留注释的 TOML 编辑。toml 只适合只读，
# 改用户的 config.toml 必须用 toml_edit，否则注释和空行全丢
toml_edit = "0.25"

# DeepSeek Harness 的 cordis.patch.yml 是 YAML 数组，条目可能嵌在
# insert 分组里，行级编辑做不了，必须完整解析成值再写回。
# Hermes 的 config.yaml 仍走行级编辑（那里有大量注释不能丢）
serde_yaml = "0.9"

# 错误处理：库层用 thiserror 定义具体错误，CLI 层用 anyhow 附加上下文
thiserror = "2"
anyhow = "1"

# 文件系统：walkdir 遍历 skill 目录，dirs 解析家目录
walkdir = "2"
dirs = "5"

# 内容指纹：比对母版与副本、检测漂移
sha2 = "0.10"

# 读 ZCode 的用量库（~/.zcode/cli/db/db.sqlite）。
# bundled 把 SQLite 静态编进来，用户机器不需要装 sqlite3.exe，
# 也不用担心版本漂移 —— 这个库是别的程序在写的，只读访问必须自己控制。
rusqlite = { version = "0.32", features = ["bundled"] }

# 写 Cursor 的 state.vscdb：它的密钥用 Electron safeStorage 加密
# （DPAPI 主密钥 + AES-256-GCM），要代写就必须能加密。
# ring 后端比 openssl 省事：不依赖系统里的 OpenSSL，Windows 上直接静态编进来。
aes-gcm = "0.10"

# Windows 专用：
# - GetConsoleProcessList / GetConsoleWindow / ShowWindow 用来藏掉
#   双击启动时系统给 console 子系统程序新建的黑窗口
# - GetFileInformationByHandle 用于判定两个路径是否互为硬链接
# - CryptUnprotectData 用 DPAPI 解开 Cursor 的 safeStorage 主密钥
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_Storage_FileSystem",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Security_Cryptography",
    "Win32_System_Memory",
] }

# 命令行解析
clap = { version = "4", features = ["derive"] }

# 时间戳：备份目录名、lock 时间比较
chrono = { version = "0.4", features = ["serde"] }

# Claude 协议转换：把 Messages 请求转发给 OpenAI Chat / Responses
ureq = "2.12"

[features]
# Tauri 2 的默认特性组合
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
# 体积优化。GUI 工具不需要极致运行时性能，优先减小产物
opt-level = "s"
lto = true
codegen-units = 1
strip = true
